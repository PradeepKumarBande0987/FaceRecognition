# ============================================
# Deployment Configuration
# ============================================

deployment:
  # General settings
  version: "1.0.0"
  environment: "production"  # development, staging, production
  
  # Model versioning
  model_versioning:
    enabled: true
    version_control: true
    version_history: true
  
  # Update strategy
  update_strategy: "blue_green"  # blue_green, canary, rolling

# ──────────────────────────────────────
# MODEL SERVING
# ──────────────────────────────────────

model_serving:
  # Framework
  framework: "torchserve"  # torchserve, tensorflow_serving, triton, kserve
  
  # Backend settings
  backend:
    workers: 4
    batch_size: 32
    timeout_seconds: 60
    
    # GPU allocation
    gpu:
      enabled: true
      device: 0  # GPU device ID
      memory_fraction: 0.8
  
  # Model loading
  model_loading:
    enable_cache: true
    cache_size_gb: 10
    lazy_loading: true

# ──────────────────────────────────────
# DOCKER DEPLOYMENT
# ──────────────────────────────────────

docker:
  enabled: true
  
  # Image settings
  image:
    registry: "docker.io"
    name: "face-recognition-system"
    tag: "latest"
    dockerfile: "Dockerfile"
  
  # Container settings
  container:
    port: 8000
    gpus: "all"
    restart_policy: "unless-stopped"
    memory_limit: "32g"
    memory_reservation: "16g"
  
  # Volume mounts
  volumes:
    - name: "data"
      path: "/app/data"
      source: "./data"
    
    - name: "models"
      path: "/app/models"
      source: "./models"
    
    - name: "logs"
      path: "/app/logs"
      source: "./logs"
    
    - name: "database"
      path: "/app/database"
      source: "./database"
  
  # Environment variables
  env_file: ".env.docker"
  
  # Build settings
  build:
    context: "."
    cache: true
    multi_stage: true

# ──────────────────────────────────────
# KUBERNETES DEPLOYMENT
# ──────────────────────────────────────

kubernetes:
  enabled: false
  
  # Cluster settings
  cluster:
    name: "face-recognition-cluster"
    namespace: "default"
  
  # Deployment settings
  deployment:
    replicas: 3
    strategy: "RollingUpdate"  # RollingUpdate, Recreate
    
    # Resource limits
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        gpu: "1"
      limits:
        cpu: "8"
        memory: "32Gi"
        gpu: "2"
  
  # Horizontal Pod Autoscaling
  autoscaling:
    enabled: true
    min_replicas: 1
    max_replicas: 10
    target_cpu_utilization: 70
    target_memory_utilization: 80
  
  # Service configuration
  service:
    type: "LoadBalancer"  # ClusterIP, NodePort, LoadBalancer
    port: 80
    target_port: 8000
  
  # Persistent volumes
  persistent_volumes:
    enabled: true
    storage_class: "fast-ssd"
    volumes:
      - name: "data"
        size: "100Gi"
      - name: "models"
        size: "50Gi"
      - name: "database"
        size: "10Gi"
  
  # Health checks
  health_checks:
    liveness_probe:
      enabled: true
      http_path: "/health"
      initial_delay: 30
      period: 10
    
    readiness_probe:
      enabled: true
      http_path: "/ready"
      initial_delay: 10
      period: 5

# ──────────────────────────────────────
# CLOUD DEPLOYMENT (AWS)
# ──────────────────────────────────────

aws:
  enabled: false
  
  region: "us-east-1"
  
  # EC2 instances
  ec2:
    enabled: true
    instance_type: "p3.8xlarge"  # GPU instance
    ami: "ami-0c55b159cbfafe1f0"  # Ubuntu 20.04
    key_pair: null
    security_group: null
  
  # S3 storage
  s3:
    enabled: true
    bucket: "face-recognition-data"
    region: "us-east-1"
    
    paths:
      data: "data/"
      models: "models/"
      logs: "logs/"
  
  # RDS database
  rds:
    enabled: true
    engine: "postgresql"
    instance_class: "db.r5.xlarge"
    allocated_storage: 100  # GB
  
  # CloudWatch monitoring
  cloudwatch:
    enabled: true
    log_group: "face-recognition"
  
  # Elastic Container Registry (ECR)
  ecr:
    enabled: true
    registry_name: "face-recognition"

# ──────────────────────────────────────
# AZURE DEPLOYMENT
# ──────────────────────────────────────

azure:
  enabled: false
  
  subscription_id: null
  resource_group: "face-recognition-rg"
  location: "eastus"
  
  # App Service
  app_service:
    enabled: true
    sku: "P2V2"  # Premium tier with GPU
  
  # Azure Container Registry
  container_registry:
    enabled: true
    name: "facerecognitionacr"
  
  # Cosmos DB
  cosmos_db:
    enabled: true
    tier: "Standard"
  
  # Storage
  storage_account:
    enabled: true
    account_type: "StorageV2"
  
  # Application Insights
  app_insights:
    enabled: true

# ──────────────────────────────────────
# MONITORING & LOGGING
# ──────────────────────────────────────

monitoring:
  # Metrics collection
  metrics:
    enabled: true
    interval_seconds: 10
    
    metrics_to_collect:
      - "request_latency"
      - "throughput"
      - "error_rate"
      - "gpu_utilization"
      - "memory_usage"
      - "cpu_usage"
  
  # Prometheus
  prometheus:
    enabled: true
    scrape_interval: 15s
    
    # Alerting rules
    alerting:
      enabled: true
      cpu_threshold: 80
      memory_threshold: 85
      gpu_threshold: 90
      error_rate_threshold: 0.05
  
  # Grafana dashboards
  grafana:
    enabled: true
    dashboard_url: "http://localhost:3000"
  
  # Alerting
  alerts:
    enabled: true
    
    channels:
      email:
        enabled: false
        recipients: []
      
      slack:
        enabled: false
        webhook_url: null
        channel: "#alerts"
      
      pagerduty:
        enabled: false
        integration_key: null

# ──────────────────────────────────────
# LOG AGGREGATION
# ──────────────────────────────────────

logging:
  # ELK Stack
  elk:
    enabled: false
    
    elasticsearch:
      host: "elasticsearch"
      port: 9200
      index_prefix: "face-recognition"
    
    logstash:
      enabled: true
      config_file: "logstash.conf"
    
    kibana:
      enabled: true
      url: "http://kibana:5601"
  
  # Loki (for Kubernetes)
  loki:
    enabled: false
    url: "http://loki:3100"
  
  # Datadog
  datadog:
    enabled: false
    api_key: null
    app_key: null

# ──────────────────────────────────────
# LOAD BALANCING
# ──────────────────────────────────────

load_balancing:
  enabled: true
  
  # Load balancer type
  type: "round_robin"  # round_robin, least_connections, ip_hash, weighted
  
  # Sticky sessions
  sticky_sessions: false
  session_timeout: 3600
  
  # Health check
  health_check:
    enabled: true
    interval: 10
    timeout: 5
    healthy_threshold: 2
    unhealthy_threshold: 3

# ──────────────────────────────────────
# SCALING POLICIES
# ──────────────────────────────────────

scaling:
  # Auto-scaling
  auto_scaling:
    enabled: true
    
    # Scale up
    scale_up:
      trigger: "cpu_threshold"
      threshold: 70
      cooldown_minutes: 5
      num_instances: 1
    
    # Scale down
    scale_down:
      trigger: "cpu_threshold"
      threshold: 30
      cooldown_minutes: 10
      num_instances: 1
  
  # Min/Max instances
  min_instances: 1
  max_instances: 10

# ──────────────────────────────────────
# SECURITY IN DEPLOYMENT
# ──────────────────────────────────────

security:
  # SSL/TLS
  ssl:
    enabled: true
    certificate: "/etc/ssl/certs/server.crt"
    key: "/etc/ssl/private/server.key"
    protocol: "TLSv1.3"
  
  # Authentication
  authentication:
    enabled: true
    method: "oauth2"  # oauth2, jwt, api_key
  
  # Network policies
  network_policies:
    enabled: true
    allow_internal_only: false
  
  # Secrets management
  secrets:
    backend: "vault"  # vault, aws_secrets_manager, azure_keyvault
    auto_rotate: true
    rotation_days: 90

# ──────────────────────────────────────
# BACKUP & DISASTER RECOVERY
# ──────────────────────────────────────

backup:
  # Database backups
  database:
    enabled: true
    frequency: "daily"
    retention_days: 30
    backup_location: "s3://backups/database"
  
  # Model checkpoints
  model_backup:
    enabled: true
    frequency: "weekly"
    retention_days: 90
    backup_location: "s3://backups/models"
  
  # Disaster recovery
  disaster_recovery:
    enabled: true
    rpo_minutes: 60  # Recovery Point Objective
    rto_minutes: 30  # Recovery Time Objective

# ──────────────────────────────────────
# COMPLIANCE
# ──────────────────────────────────────

compliance:
  # Data privacy
  gdpr:
    enabled: true
    data_retention_days: 365
  
  # Data encryption
  encryption:
    enabled: true
    in_transit: true
    at_rest: true
    algorithm: "aes_256"
  
  # Audit logging
  audit:
    enabled: true
    log_access: true
    log_modifications: true
